/* ===== Noir & Gold theme: perfume-house black, gold for money and the one action that moves work forward ===== */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#131210;--surface:#1B1A17;--surface2:#161513;--ink:#F1ECE2;--muted:#A49C8D;--line:#2D2A25;--hover:#201E1A;
  --accent:#C9A45C;--accent-ink:#17120A;--accent-soft:#2A2417;--accent2:#B48F48;
  --warn:#E9A25B;--warn-soft:#33240F;--bad:#EA8C7C;--bad-soft:#3A1E19;--ok:#86C9A0;--ok-soft:#16291E;
  --glass:#0A0908;--glass2:#1F1D19;--glass-ink:#F1ECE2;--glass-muted:rgba(241,236,226,.55);--gold:#E3C383;--navy:#0A0908;
  --p-ol:#e8e2d6;--p-eb:#e0a08d;--p-mg:#93a6ec;--p-rd:#6cc9a3;--p-dn:#d4af5a;
  --ui:'Readex Pro','IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;--r:16px;color-scheme:dark}

body{font-family:var(--ui);font-size:14.5px;line-height:1.55}
h2{font-size:24px;font-weight:700;letter-spacing:-.2px}
h3{font-size:15.5px;font-weight:600}
.sub,.hint{color:var(--muted)}

/* app bar: bottle-green band; the active tab is cut from the page colour so it reads as a folder tab opening into the page */
.appbar{background:var(--glass);color:var(--glass-ink);border-bottom:0;padding:12px 16px 0}
.appname{color:#fff;font-weight:700;font-size:18px;letter-spacing:.2px}
.appname i{gap:2px}.appname i span{width:5px;height:18px;border-radius:3px}
.role{color:var(--glass-muted)}.role span#who{color:#fff;font-weight:600}
.appbar .btn{background:transparent;border-color:rgba(255,255,255,.16);color:var(--glass-ink)}
.appbar .btn:hover{border-color:rgba(255,255,255,.42);background:rgba(255,255,255,.04)}
.appbar .btn.ghost{border-color:transparent;color:var(--glass-muted)}
.tabs{gap:2px;margin-top:12px;padding:0}
.tabs button,.tabs a{color:var(--glass-muted);background:none;border:0;border-radius:12px 12px 0 0;padding:10px 15px 12px;font-weight:500}
.tabs button:hover,.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs button.on,.tabs a.on{background:var(--bg);color:var(--ink);font-weight:600}
.tabs .badge{background:var(--gold);color:#1f1300}

@media (min-width:1100px){
  body{padding-inline-start:268px;padding-inline-end:32px}
  .appbar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:244px;margin:0;padding:24px 0 18px;padding-inline-start:16px;display:flex;flex-direction:column;gap:22px;z-index:20}
  .toprow{display:contents}
  .appname{order:0;font-size:20px;padding-inline-end:16px}
  .tabs{order:1;flex:1;flex-direction:column;overflow-y:auto;margin:0;gap:2px}
  .tabs button,.tabs a{text-align:start;border-radius:0;border-start-start-radius:12px;border-end-start-radius:12px;padding:11px 14px;font-size:14.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .role{order:2;flex-direction:column;align-items:stretch;gap:6px;padding-inline-end:16px}
  .role span#who{padding:0 4px 4px;font-size:14px}
  .role .btn{width:100%;text-align:start}
  main{padding-top:30px}
}

/* surfaces */
.panel,.dk,.tbl{border-radius:var(--r);border-color:var(--line);box-shadow:none}
.panel{padding:18px}
textarea,select,input[type=password],input[type=text],input[type=number],input[type=search],input[type=tel],input[type=date]{border-radius:10px;border-color:var(--line);background:var(--surface)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
th{background:var(--surface2);color:var(--muted);font-weight:500;font-size:12.5px}
:root[data-theme="light"] th{background:var(--surface2)}

function lowMargins(){const d=new Date();d.setDate(d.getDate()-60);const since=ld(d);const sold=new Set();
  S.invoices.forEach(i=>{if(i.date>=since)i.lines.forEach(l=>{if(l.pid)sold.add(l.pid+':'+i.page)})});
  const out=[];S.products.forEach(p=>{const g=gOf(p.id);const uc=unitCostOf(p.id,g);if(uc==null||!(uc>0))return;
    PAGES.forEach(pg=>{if(!sold.has(p.id+':'+pg.id))return;const pr=(p.prices||{})[pg.id];if(!(pr>0))return;const m=(pr-uc)/pr;if(m<MG_TH(pg.id))out.push({p,pg:pg.id,pr,uc,m})})});
  return out.sort((a,b)=>a.m-b.m)}
function mgPanel(){const L=lowMargins();if(!L.length)return '';const neg=L.filter(x=>x.m<0).length;

/* Advisory only: which draft lines cannot be made from what is free right now. Never blocks saving.
   Free empties = product stock (already net of open orders). Free oil = on the shelf − reserved for open orders.
   While editing, the invoice's own old lines are added back so it is not counted against itself. */
function draftShort(){
  if(!D||!D.lines.length||!can('stock'))return null;
  const hasOil=(S.materials||[]).some(m=>m.kind==='oil');
  const ek=pid=>{const p=prod(pid);return p?(p.stock_of||p.id):pid};
  const fe={},fo={},po=hasOil?pendOil():{};
  const old=D.editId?S.invoices.find(x=>x.id===D.editId):null;
  const be={},bo={};if(old)old.lines.forEach(l=>{if(!l.pid)return;const k=ek(l.pid);be[k]=(be[k]||0)+l.qty;const r=rcp(l.pid),g=l.ga??l.grams;if(r&&r.oil&&g!=null)bo[r.oil]=(bo[r.oil]||0)+l.qty*g});
  const L=[];let n=0,pcs=0;
  D.lines.forEach((l,i)=>{const p=l.pid&&prod(l.pid);const o={e:0,o:0,full:false};L[i]=o;if(!p)return;const q=+l.qty||0;let cant=0,ce=false,co=false;
    if(p.track){const k=ek(p.id);if(fe[k]==null)fe[k]=Math.max(0,(prod(k)||p).stock+(be[k]||0));const use=Math.min(q,fe[k]);o.e=q-use;fe[k]-=use;cant=o.e;ce=true}
    const r=rcp(p.id),g=lineG(l);
    if(hasOil&&r&&r.oil&&g>0){const m=S.materials.find(x=>x.id===r.oil);if(m){if(fo[m.id]==null)fo[m.id]=Math.max(0,Math.max(0,m.stock)-(po[m.id]||0)+(bo[m.id]||0));const need=q*g,use=Math.min(need,fo[m.id]);o.o=Math.round((need-use)*10)/10;fo[m.id]-=use;if(o.o>0)cant=Math.max(cant,Math.min(q,Math.ceil(o.o/g)));co=true}}
    o.full=ce&&co;if(o.e||o.o){n++;pcs+=cant}});
  return {L,n,pcs};
}

   ${v!==cur?`<small class="sub">كان ${fmt(cur)} · ${v>cur?`هتتسجل دفعة ${fmt(r2(v-cur))}`:`هيتلغي ${fmt(r2(cur-v))} من المدفوع`}</small>`:''}${due>0?`<small class="sub">آجل <b class="num" style="color:var(--bad);font-size:15px">${fmt(due)}</b></small>`:''}</div>`;

let acItems=[],acI=0;
function searchProducts(q){
  const n=norm(q);if(!n)return[];const toks=n.split(' ');const t=n.replace(/\s/g,'');
  const L=pIndex();
  let r=L.filter(x=>toks.every(k=>x.n.includes(k))||x.t.includes(t));
  const al=(S.alias||{})[t];if(al&&prod(al)&&!r.find(x=>x.p.id===al))r.unshift({p:prod(al),n:'',t:''});
  if(!r.length&&t.length>=3)r=L.map(x=>({...x,s:dice(t,x.t)})).filter(x=>x.s>=.45).sort((a,b)=>b.s-a.s);
  else r.sort((a,b)=>((b.n.startsWith(n))-(a.n.startsWith(n)))||(a.n.length-b.n.length));
  return r.slice(0,8).map(x=>x.p);
}

const AR=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const norm=s=>AR(s).toLowerCase().replace(/[‎‏]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ڤ/g,'ف').replace(/پ/g,'ب').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[ً-ْـ]/g,'').replace(/[()\[\]\-–—_.,،:؛"'&+\/]/g,' ').replace(/\s+/g,' ').trim();
const tight=s=>norm(s).replace(/\s/g,'');
function bigr(s){const a=new Map();for(let i=0;i<s.length-1;i++){const b=s.slice(i,i+2);a.set(b,(a.get(b)||0)+1)}return a}
function dice(a,b){if(a.length<2||b.length<2)return a===b?1:0;const A=bigr(a),B=bigr(b);let m=0;A.forEach((v,k)=>{if(B.has(k))m+=Math.min(v,B.get(k))});return 2*m/(a.length+b.length-2)}
let PIDX=null;
function similarProds(n,excl){const t=tight(n);if(t.length<3)return [];return pIndex().filter(x=>x.p.id!==excl&&!x.p.hidden).map(x=>{let s=dice(t,x.t);if(t.length>=4&&x.t.length>=4&&(x.t.includes(t)||t.includes(x.t)))s=Math.max(s,.86);return {p:x.p,s}}).filter(x=>x.s>=.72).sort((a,b)=>b.s-a.s).slice(0,5)}
let simArm='';
function simGuard(names){names=[].concat(names).filter(Boolean);const hits=names.map(n=>({n,L:similarProds(n).filter(x=>tight(x.p.name)!==tight(n))})).filter(h=>h.L.length);const k=names.map(tight).join('|');
  if(!hits.length||simArm===k){simArm='';return true}simArm=k;
  toast(`⚠️ ${hits.map(h=>`"${h.n}" شبه: ${h.L.slice(0,3).map(x=>x.p.name).join(' / ')}`).join(' · ')} — لو صنف جديد فعلًا دوس تاني، ولو هو نفسه اختاره من القايمة`);return false}
function pIndex(){if(!PIDX||PIDX.n!==S.products.length)PIDX={n:S.products.length,l:S.products.map(p=>({p,n:norm(p.name),t:tight(p.name)}))};return PIDX.l}
function matchProduct(q,strict){
  const n=norm(q),t=n.replace(/\s/g,'');if(t.length<2)return null;
  const al=(S.alias||{})[t];if(al&&prod(al))return {p:prod(al),how:tight(prod(al).name)===t?'exact':'alias'};
  const L=pIndex();
  const e=L.find(x=>x.n===n||x.t===t);if(e)return {p:e.p,how:'exact'};
  const c=L.filter(x=>(t.length>=4&&x.t.includes(t)&&t.length/x.t.length>=.5)||(x.t.length>=5&&t.includes(x.t)&&x.t.length/t.length>=.6));
  if(c.length===1)return {p:c[0].p,how:t.length/c[0].t.length>=.8?'exact':'fuzzy'};
  if(c.length>1){c.sort((a,b)=>(b.t.startsWith(t)-a.t.startsWith(t))||(Math.abs(a.t.length-t.length)-Math.abs(b.t.length-t.length)));return {p:c[0].p,how:'fuzzy'}}
  let best=null,bs=0;L.forEach(x=>{const d=dice(t,x.t);if(d>bs){bs=d;best=x}});
  if(best&&bs>=(strict?.8:.78))return {p:best.p,how:'fuzzy'};
  return null;
}
function learn(raw,pid){const k=tight(cleanItemText(raw).name);if(k.length>=2&&S.alias[k]!==pid){S.alias[k]=pid;PIDX=null;sb.from('aliases').upsert({key:k,product_id:pid}).then(()=>{})}}
const HEAD=new Set(['المنتج','المنتجات','الصنف','الاصناف','الكميه','الكميات','السعر','الاسعار','الاوردر','اوردر','order','طلب','الطلب','العدد','الاجمالي','تفاصيل','السلام','عليكم','عايز','محتاج','لو','سمحت','من','فضلك','ازيك','صباح','مساء','الخير','النور','شكرا','تمام']);
const CITIES=['شرم الشيخ','الغردقه','القاهره','الجيزه','الاسكندريه','اسكندريه','المنصوره','طنطا','الزقازيق','اسيوط','سوهاج','قنا','الاقصر','اسوان','بورسعيد','السويس','الاسماعيليه','دمياط','المنيا','بني سويف','الفيوم','كفر الشيخ','شبين الكوم','بنها','دمنهور','مرسي مطروح','مطروح','العريش','اكتوبر','6 اكتوبر','الشيخ زايد','مدينه نصر','المعادي','حلوان','التجمع','العبور','الشروق','العاشر من رمضان','المحله','المحله الكبري','ميت غمر','دهب','نويبع','سفاجا','القصير','مرسي علم','الوادي الجديد','البحر الاحمر','جنوب سيناء','الشرقيه','الدقهليه','الغربيه','المنوفيه','القليوبيه','البحيره','ملوي','ادفو','كوم امبو','نجع حمادي','قويسنا','شبرا','الهرم','فيصل','المهندسين','الدقي','العجوزه','مصر الجديده','عين شمس','المرج','السلام','الزيتون','حدائق القبه','المطريه','النزهه','الرحاب','مدينتي','بدر','العين السخنه','راس سدر','الطور','كفر الدوار','رشيد','ادكو','ابو حمص','سيدي سالم','دسوق','بيلا','فوه','زفتي','السنطه','كفر الزيات','المنزله','طلخا','السنبلاوين','بلقاس','اجا','فاقوس','ابو كبير','منيا القمح','بلبيس','ههيا','الحسينيه','قليوب','شبرا الخيمه','طوخ','القناطر','الخانكه'].map(c=>norm(c)).sort((a,b)=>b.length-a.length);
function cleanItemText(raw){
  let s=AR(raw).replace(/[‎‏]/g,'').trim();let qty=null,price=null,lead=null;
  s=s.replace(/^[\s•●▪◦✓✔️*]+/,'');
  s=s.replace(/^(\d{1,4})\s*(?:[-–—.)×xX*:]|\s(?=\D))\s*/,(m,a)=>{lead=+a;return ''});
  s=s.replace(/(?:[x×*]\s*(\d+))|(?:(\d+)\s*[x×*])/i,(m,a,b)=>{qty=+(a||b);return ' '});
  s=s.replace(/(?:عدد|كميه|كمية|الكمية|الكميه)\s*[:=]?\s*(\d+)/,(m,a)=>{qty=+a;return ' '});
  s=s.replace(/(\d+)\s*(?:قطعه|قطعة|قطع|حبه|حبة|حبات|علبه|علبة|pcs|pc)(?=\s|$)/i,(m,a)=>{qty=+a;return ' '});
  s=s.replace(/(?:^|\s)(?:بسعر|السعر|سعر|ب)ـ*\s*[:=]?\s*(\d{2,5})/,(m,a)=>{price=+a;return ' '});
  s=s.replace(/(\d{2,5})\s*(?:ج\.?م|جنيه|جنية|جم|ج|le|egp|l\.e)(?=[\s.]|$)/i,(m,a)=>{price=+a;return ' '});
  if(lead!=null){if(qty==null)qty=lead}
  s=s.replace(/[=:]/g,' ').replace(/\s+/g,' ').trim();
  return {name:s,qty,price};
}
function parseOrder(txt){
  const R={name:'',phone:'',phone2:'',addr:'',ship:null,lines:[]};
  const phones=[];const addAddr=v=>{v=v.trim();if(v)R.addr=R.addr?R.addr+'، '+v:v};
  let lines=AR(txt).split(/\r?\n/).map(l=>l.replace(/[‎‏]/g,'').trim()).filter(Boolean);
  lines=lines.flatMap(l=>{if(/^(الاسم|اسم|العنوان|عنوان|name|address)/.test(norm(l)))return [l];const parts=l.split(/\s*[،,+؛;]\s*|\s+و(?=\s*\d)/).map(x=>x.trim()).filter(Boolean);
    if(parts.length<2)return [l];const ok=parts.filter(x=>/\d/.test(x)&&matchProduct(cleanItemText(x).name.replace(/(^|\s)\d+(?=\s|$)/g,' '),false));return ok.length>=2&&ok.length>=parts.length-1?parts:[l]});
  const after=l=>l.includes(':')||l.includes('：')?l.replace(/^[^:：]*[:：]\s*/,'').trim():l.replace(/^\S+\s*/,'').trim();
  for(const raw of lines){
    const l=raw.replace(/^[\s•●▪◦✓✔️]+/,'').trim();
    if(!/[\p{L}\d]/u.test(l))continue;
    const n=norm(l);
    const flat=l.replace(/[\s\-.]/g,'').replace(/^\+?20(?=1)/,'0');
    const ph=flat.match(/(?:\+?20)?01[0125]\d{8}/g);
    let rest=l;
    if(ph){ph.forEach(x=>{x=x.replace(/^\+?20/,'');if(!phones.includes(x))phones.push(x)});
      rest=l.replace(/(?:\+?20)?0\s*1[0125](?:[\s\-.]*\d){8}/g,' ').replace(/(رقم|موبايل|تليفون|تلفون|هاتف|واتس|واتساب|phone|mobile|اضافي|إضافي|تاني|ثاني|التليفون|الموبايل|الرقم|[:\/،,\-])/gi,' ').trim();
      if(norm(rest).replace(/\s/g,'').length<2)continue}
    const rn=norm(rest);
    if(rn.split(' ').every(w=>HEAD.has(w)))continue;
    if(/^(الاسم|اسم العميل|اسم|name|العميل|المستلم)(\s|$)/.test(rn)){R.name=after(rest);continue}
    if(/^(العنوان|عنوان|address|المحافظه|المنطقه)(\s|$)/.test(rn)){addAddr(after(rest));continue}
    if(/^(شحن|الشحن|مصاريف الشحن|التوصيل|توصيل|مصاريف التوصيل|delivery|shipping)(\s|$)/.test(rn)){const m=rn.match(/\d+/);R.ship=m?+m[0]:0;continue}
    if(/^(الاجمالي|المجموع|الحساب|total|الكل|اجمالي)(\s|$)/.test(rn))continue;
    if(/(^|\s)(شارع|ش|عماره|محافظه|مدينه|برج|الدور|دور|شقه|بجوار|امام|خلف|منطقه|حي|قريه|مركز|ميدان|كمبوند|بلوك|طريق|عزبه|نجع)(\s|$)/.test(rn)&&!matchProduct(rn.replace(/\d+/g,' '),true)){addAddr(rest);continue}
    const it=cleanItemText(rest);
    const hasNum=it.qty!=null||it.price!=null||/\d/.test(rest);
    let m=null;
    if(it.name){const toks=it.name.split(' ');const nums=toks.filter(x=>/^\d+$/.test(x));const words=toks.filter(x=>!/^\d+$/.test(x)).join(' ');
      const full=pIndex().find(x=>x.n===norm(it.name));
      m=full?{p:full.p,how:'exact'}:words?matchProduct(words,!hasNum):null;
      const inName=m?norm(m.p.name).split(' '):[];
      nums.filter(x=>!inName.includes(x)).forEach(x=>{const v=+x;if(v>=100&&it.price==null)it.price=v;else if(it.qty==null&&v>0&&v<100)it.qty=v});
      if(!m&&words)it.name=words;
    }
    if(m||hasNum){
      if(!it.name)continue;
      const line={pid:null,raw:it.name,qty:it.qty||1,price:it.price,auto:it.price==null,how:'none',sugg:[]};
      if(m){line.pid=m.p.id;line.how=m.how;if(m.how==='fuzzy')line.sugg=suggest(it.name).filter(x=>x!==m.p.id)}else line.sugg=suggest(it.name);
      const ex=line.pid&&R.lines.find(x=>x.pid===line.pid);
      if(ex){ex.qty+=line.qty}else R.lines.push(line);
      continue;
    }
    // text-only line: name and/or city
    const city=CITIES.find(cn=>rn===cn||rn.endsWith(' '+cn)||rn.includes(' '+cn+' '));
    if(city){
      const idx=rn.indexOf(city);const before=rn.slice(0,idx).trim();
      if(before&&!R.name){const w=before.split(' ').length;R.name=rest.split(/\s+/).slice(0,w).join(' ');addAddr(rest.split(/\s+/).slice(w).join(' '))}
      else addAddr(rest);
      continue;
    }
    if(!R.name){R.name=rest;continue}
    addAddr(rest);
  }
  R.phone=phones[0]||'';R.phone2=phones[1]||'';
  return R;
}
function applyParsed(txt){
  const R=parseOrder(txt);
  if(R.name)D.cust.name=R.name;if(R.phone)D.cust.phone=R.phone;if(R.phone2)D.cust.phone2=R.phone2;if(R.addr)D.cust.addr=R.addr;
  if(R.ship!=null)D.ship=R.ship;
  linkCust('parse');
  R.lines.forEach(l=>{if(l.pid&&l.auto)l.price=autoPrice(l.pid).price});
  R.lines.forEach(l=>{const ex=l.pid&&D.lines.find(x=>x.pid===l.pid);if(ex)ex.qty=+ex.qty+l.qty;else D.lines.push(l)});
  D.paste=false;D.pasteText='';
  const nb=R.lines.filter(l=>!l.pid).length,nf=R.lines.filter(l=>l.how==='fuzzy').length;
  render();
  toast(`اتقرا ${R.lines.length} صنف`+(nb?` · ${nb} مش في القايمة`:'')+(nf?` · ${nf} محتاج تتأكد منه`:''));
}

/* ---------- customers save (cloud) ---------- */
async function saveCustomer(c){
  const row={page_id:c.page,name:c.name,phone:c.phone,phone2:c.phone2,addr:c.addr,type:c.type,weekly:c.weekly};
  const ok=await act(async()=>{
    let id=c.id;
    if(id){await q(sb.from('customers').update(row).eq('id',id))}else{id=(await q(sb.from('customers').insert(row).select('id').single())).id}
    if(can('prices')){
      const old=cust(c.id)?.special||{};const now=c.type==='vip'?c.special:{};
      const del=Object.keys(old).filter(k=>!(k in now));
      if(del.length)await q(sb.from('customer_prices').delete().eq('customer_id',id).in('product_id',del));
      const up=Object.entries(now).map(([pid,price])=>({customer_id:id,product_id:pid,price:+price}));
      if(up.length)await q(sb.from('customer_prices').upsert(up));
    }
    c.id=id;return id;
  });
  if(!ok)return;
  await loadAll();$('#modal').hidden=true;cPage=c.page;
  if(D&&D.cust.id===c.id){D.cust={id:c.id,name:c.name,phone:c.phone,phone2:c.phone2,addr:c.addr};refreshAuto()}
  render();toast('اتحفظ العميل');
}

const METHODS={cash:'كاش',vodafone:'فودافون كاش',instapay:'إنستا باي',bank:'تحويل بنكي',other:'أخرى'};
const EXP_CATS=['إعلانات','شحن','مرتبات','إيجار','تغليف','مشتريات متنوعة','أخرى'];
const r2=n=>Math.round((+n||0)*100)/100;

/* ---------- money helpers ---------- */
const retsOf=i=>S.returns.filter(r=>r.invId===i.id);
const invRet=i=>retsOf(i).reduce((a,r)=>a+r.lines.reduce((b,l)=>b+l.qty*l.price,0),0);
const invRetPcs=i=>retsOf(i).reduce((a,r)=>a+r.lines.reduce((b,l)=>b+l.qty,0),0);
const invSales=i=>invSub(i)-invRet(i);
const invNet=i=>r2(invTot(i)-invRet(i));
let ALLOC=null,ALLOCK=null;
function allocAll(){ALLOC={};const byC={};S.invoices.forEach(i=>{const k=i.custId&&S.customers.some(c=>c.id===i.custId)?i.custId:null;if(k)(byC[k]??=[]).push(i);else ALLOC[i.id]=r2(Math.min(invOwed(i),S.payments.filter(p=>p.invId===i.id&&!p.void).reduce((a,p)=>a+p.amount,0)))});
  for(const [cid,invs] of Object.entries(byC)){let pool=S.payments.filter(p=>p.custId===cid&&!p.void).reduce((a,p)=>a+p.amount,0);
    invs.sort((a,b)=>a.date.localeCompare(b.date)||a.no.localeCompare(b.no)).forEach(i=>{const n=invOwed(i);const a=Math.max(0,Math.min(pool,n));ALLOC[i.id]=r2(a);pool=r2(pool-a)})}}
function invPaid(i){const k=S.invoices.length+':'+S.payments.length+':'+S.returns.length+':'+lastLoad;if(ALLOCK!==k||!ALLOC){allocAll();ALLOCK=k}return ALLOC[i.id]||0}
const invOwed=i=>r2(invNet(i)+ +(i.prev||0));
const invDue=i=>r2(invOwed(i)-invPaid(i));
function payChip(i){const d=invDue(i),pd=invPaid(i);return d<=0?'<span class="chip ok">مدفوعة</span>':pd>0?`<span class="chip warn">باقي ${fmt(d)}</span>`:`<span class="chip bad">آجل ${fmt(d)}</span>`}
function custBal(c){const inv=S.invoices.filter(i=>i.custId===c.id);return r2(inv.reduce((a,i)=>a+invOwed(i),0)-S.payments.filter(p=>p.custId===c.id&&!p.void).reduce((a,p)=>a+p.amount,0))}
const visCustomers=()=>S.customers.filter(c=>!myPage()||c.page===myPage());

/* ---------- payments ---------- */
let dupPayArm='';
function dupPay(custId,amount,invId){const now=Date.now();return (S.payments||[]).find(p=>!p.void&&r2(p.amount)===r2(amount)&&(invId?p.invId===invId:p.custId===custId)&&p.at&&now-new Date(p.at).getTime()<3600e3)}
async function addPayment(custId,amount,method,note,invId){
  amount=r2(amount);if(!(amount>0)){toast('اكتب مبلغ صحيح');return false}
  const c=cust(custId);if(!c){toast('العميل مش موجود');return false}
  {const dp=dupPay(custId,amount,invId),dk=custId+'|'+amount+'|'+(invId||'');
   if(dp&&dupPayArm!==dk){dupPayArm=dk;const mins=Math.max(1,Math.round((Date.now()-new Date(dp.at).getTime())/60000));toast(`⚠️ في دفعة بنفس المبلغ ${fmt(amount)} ج اتسجلت من ${mins} دقيقة على نفس ${invId?'الفاتورة':'العميل'}. لو دي دفعة تانية فعلًا دوس سجّل تاني`);return false}
   dupPayArm=''}
  let rows=[];
  if(invId){rows=[{customer_id:custId,invoice_id:invId,amount,method,note}]}
  else{ // allocate to oldest unpaid invoices
    let left=amount;const inv=S.invoices.filter(i=>i.custId===custId&&invDue(i)>0).sort((a,b)=>a.date.localeCompare(b.date));
    for(const i of inv){if(left<=0)break;const a=Math.min(left,invDue(i));rows.push({customer_id:custId,invoice_id:i.id,amount:r2(a),method,note});left=r2(left-a)}
    if(left>0)rows.push({customer_id:custId,invoice_id:null,amount:left,method,note:note||'رصيد مقدم'});
  }
  const ok=await act(()=>q(sb.from('payments').insert(rows)));if(!ok)return false;
  await loadAll();toast(`اتسجلت دفعة ${fmt(amount)} ج`);return true;
}

/* ---------- reorder suggestions ---------- */
function reorderList(){
  const since=daysAgo(30),sold={};
  S.invoices.filter(i=>i.date>=since).forEach(i=>i.lines.forEach(l=>sold[l.pid]=(sold[l.pid]||0)+l.qty));
  S.returns.filter(r=>r.date>=since).forEach(r=>r.lines.forEach(l=>sold[l.pid]=(sold[l.pid]||0)-l.qty));
  return S.products.filter(p=>p.track).map(p=>{const s=Math.max(0,sold[p.id]||0),rate=s/30,st=Math.max(0,p.stock);
    const days=rate>0?st/rate:Infinity;const need=rate>0?Math.max(0,Math.ceil(rate*30-st)):0;return {p,rate,days,need,sold:s}})
   .filter(x=>x.rate>0&&x.days<10&&x.need>0)
   .sort((a,b)=>a.days-b.days);
}

  const rets=S.returns.filter(r=>r.date>=from&&r.date<=to);
  let sales=0,cogs=0,miss=0,ship=0,pcs=0,sk=0,missS=0;const prodA={},pageA={},custA={};
  const addP=(pid,name,qty,rev,cost,page,cid)=>{const a=prodA[pid]??={name,qty:0,sales:0,profit:0,known:true};a.qty+=qty;a.sales+=rev;if(cost==null)a.known=false;else a.profit+=rev-cost;
    const g=pageA[page]??={sales:0,profit:0,n:0};g.sales+=rev;if(cost!=null)g.profit+=rev-cost;
    if(cid){const c=custA[cid]??={sales:0,profit:0,pcs:0,g:0,gq:0,unk:0,n:new Set()};c.sales+=rev;c.pcs+=qty;if(cost!=null)c.profit+=rev-cost;else c.unk++}};
  inv.forEach(i=>{ship+=+i.ship||0;(pageA[i.page]??={sales:0,profit:0,n:0}).n++;i.lines.forEach(l=>{const rev=l.qty*l.price,cost=l.cost==null?null:l.qty*l.cost;sales+=rev;pcs+=l.qty;if(cost==null){miss++;missS+=rev}else{cogs+=cost;sk+=rev}addP(l.pid,l.name,l.qty,rev,cost,i.page,i.custId);if(i.custId&&custA[i.custId]){const c=custA[i.custId];c.n.add(i.id);if(l.grams!=null){c.g+=l.qty*(l.ga??l.grams);c.gq+=l.qty}}})});
  rets.forEach(r=>r.lines.forEach(l=>{const rev=l.qty*l.price,cost=l.cost==null?null:l.qty*l.cost;sales-=rev;pcs-=l.qty;if(cost!=null){cogs-=cost;sk-=rev}else missS-=rev;addP(l.pid,l.name,-l.qty,-rev,cost==null?null:-cost,r.page,r.custId)}));

function plFlow(groups,cols,RH,GH,capFirst,capRest,contTitle){
  const pages=[];let C=Array.from({length:cols},()=>[]),ci=0,used=0,cap=capFirst;
  const next=()=>{ci++;used=0;if(ci>=cols){pages.push(C);C=Array.from({length:cols},()=>[]);ci=0;cap=capRest}};
  groups.forEach(g=>{let k=0,first=true;
    while(k<g.items.length){
      if(GH){if(used+GH+RH>cap)next();C[ci].push(first?g.head:contTitle(g));used+=GH}
      else if(used+RH>cap)next();
      first=false;
      while(k<g.items.length&&used+RH<=cap){C[ci].push(g.items[k++]);used+=RH}
      if(k<g.items.length)next();
    }});
  if(C.some(c=>c.length)||!pages.length)pages.push(C);
  return pages;
}

    const G=byBrand(L,arCmp).sort((a,b)=>b.l.length-a.l.length).map(g=>({head:`<div class="gh">${esc(g.b)}</div>`,b:g.b,items:g.l.map(x=>`<div class="it"><span class="nm">${esc(x.n)}</span><b>${fmt(x.pr)}</b></div>`)}));

  }
  if(page==='mg'){ // one numbered table, all items A→Z, brand as a column

    const G=[{head:'',items:all.map((x,k)=>`<div class="it"><span class="n">${k+1}</span><span class="nm">${esc(x.n)}</span><span class="bn nm">${esc(x.b)}</span><b>${fmt(x.pr)}</b></div>`)}];

      ${i===0?band:''}<div class="bd"><div class="th"><span>م</span><span>الصنف</span><span>الماركة</span><span style="text-align:left">السعر</span></div>${c[0].join('')}</div>
      <div class="ft"><span>الماجيك — ريحة تفضل معاك</span><span>صفحة ${i+1}</span></div></section>`).join('');
  }
  if(page==='rd'){ // grouped by price tier (cheapest first), names only
    const m=new Map();[...L].sort(arCmp).forEach(x=>{if(!m.has(x.pr))m.set(x.pr,[]);m.get(x.pr).push(x)});
    const G=[...m.entries()].sort((a,b)=>a[0]-b[0]).map(([pr,l])=>({pr,head:`<div class="gh"><span>فئة ${arNum(fmt(pr))} جنيه</span><b>${arNum(l.length)} صنف</b></div>`,items:l.map(x=>`<div class="it"><span class="nm">${esc(x.n)}</span></div>`)}));
    const P=plFlow(G,3,22,38,H-150-14-38-6-TB,H-60-14-38-6,g=>`<div class="gh"><span>فئة ${arNum(fmt(g.pr))} جنيه</span><b>تكملة</b></div>`);const N=P.length;
    const mark=(w)=>RD_MARK.replace('width="74" height="74"',`width="${w}" height="${w}"`);
    return P.map((c,i)=>`<section class="plp pl-rd">${i===0?`<div class="hd big">${mark(84)}<div><div class="nmw">الرضوان</div><div class="sub">عطور جملة · الأسعار حسب الفئة</div></div><div class="dt">تحديث<br><b>${d}</b></div></div>`:`<div class="hd sm">${mark(38)}<div class="nmw">الرضوان</div><div class="dt">${d}</div></div>`}
      ${i===0?band:''}<div class="bd">${c.map(x=>`<div class="col">${x.join('')}</div>`).join('')}</div>
      <div class="ft"><span>الرضوان لعطور الجملة</span><span>ص ${arNum(i+1)} من ${arNum(N)}</span></div></section>`).join('');
  }
  // dn — luxury: brands A→Z (latin first), serif, roman page numbers
  const G=byBrand(L,arCmp).sort((a,b)=>a.b.localeCompare(b.b)).map(g=>({head:`<div class="gh">${esc(g.b)}</div>`,b:g.b,items:g.l.map(x=>`<div class="it"><span class="nm">${esc(x.n)}</span><i></i><b>${fmt(x.pr)}</b></div>`)}));
  const P=plFlow(G,2,25,40,H-196-8-26-44-6-TB,H-62-8-26-44-6,g=>`<div class="gh">${esc(g.b)}</div>`);
  return P.map((c,i)=>`<section class="plp pl-dn">${i===0?`<div class="hd big"><img src="${DINAR}" alt="DÎNAR"><div class="cap">LA COLLECTION · ${d}</div></div>`:`<div class="hd sm"><img src="${DINAR}" alt=""><div class="cap">LA COLLECTION</div></div>`}
    ${i===0?band:''}<div class="bd">${c.map(x=>`<div class="col">${x.join('')}</div>`).join('')}</div>
    <div class="ft"><span>—</span><span>${plRoman(i+1)}</span><span>—</span></div></section>`).join('');
}

/* ---------- public order page (no login) ---------- */
let OP=null;
async function startOrderPage(token){
  $('#boot').hidden=false;$('#login').hidden=true;$('#app').hidden=true;
  let pin='';try{pin=localStorage.getItem('pin-'+token)||''}catch(e){}
  let cat=null;try{cat=await q(sb.rpc('get_order_catalog',{p_token:token,p_pin:pin||null}))}catch(e){}
  if(!cat){$('#boot').textContent='اللينك ده مش شغال. كلّم البائع يبعتلك لينك جديد.';return}
  if(cat.locked){$('#boot').hidden=true;$('#orderApp').hidden=false;return drawPin(token,cat)}
  let cart={};try{cart=JSON.parse(localStorage.getItem('cart-'+token)||'{}')}catch(e){}
  OP={token,pin,cat,cart,q:'',brand:cat.products.some(p=>p.mine)?'__mine':'',step:'shop',done:null,cust:{name:'',phone:'',addr:''},note:'',extra:''};
  document.title=cat.page.name;$('#boot').hidden=true;$('#orderApp').hidden=false;
  document.documentElement.style.setProperty('--pc',({ol:'#111111',eb:'#b5735f',mg:'#1d2b5e',rd:'#1d6a4e',dn:'#1a1a1a'})[cat.page.id]||'#0d5a53');drawOP();
}
function drawPin(token,g){
  const msg=g.why==='badpin'?`الرقم السري غلط${g.left!=null?` · فاضل ${g.left} محاولات`:''}`:g.why==='locked'?`اتقفل اللينك مؤقتًا بسبب محاولات غلط. جرّب بعد ${g.mins} دقيقة`:'';
  $('#orderApp').innerHTML=`<div class="ophead"><h1>🔒 لينك خاص</h1><p>اكتب الرقم السري اللي وصلك من البائع</p></div>
   <div class="opbody" style="max-width:360px;margin:24px auto;display:flex;flex-direction:column;gap:12px"><input type="tel" inputmode="numeric" id="opPin" maxlength="8" dir="ltr" placeholder="• • • •" style="font-size:28px;text-align:center;letter-spacing:10px" ${g.why==='locked'?'disabled':''}>
   ${msg?`<p style="color:var(--bad);text-align:center;margin:0">${msg}</p>`:''}<button class="btn pri big" id="opPinGo" ${g.why==='locked'?'disabled':''}>دخول</button></div>`;
  const go_=async()=>{const v=$('#opPin').value.trim();if(!v)return;try{localStorage.setItem('pin-'+token,v)}catch(e){}$('#orderApp').hidden=true;$('#boot').hidden=false;startOrderPage(token)};
  $('#opPinGo').onclick=go_;$('#opPin').onkeydown=e=>{if(e.key==='Enter')go_()};setTimeout(()=>$('#opPin')?.focus(),50);
  try{if(g.why==='badpin')localStorage.removeItem('pin-'+token)}catch(e){}
}
function opSave(){try{localStorage.setItem('cart-'+OP.token,JSON.stringify(OP.cart))}catch(e){}}
function drawOP(){
  const c=OP.cat,items=Object.entries(OP.cart).filter(([,q])=>q>0).map(([id,q])=>({p:c.products.find(x=>x.id===id),q})).filter(x=>x.p);
  const tot=items.reduce((a,x)=>a+x.q*x.p.price,0),pcs=items.reduce((a,x)=>a+x.q,0);
  if(OP.done){$('#orderApp').innerHTML=`<div class="ophead"><h1>${esc(c.page.name)}</h1></div><div class="opdone"><div class="ok">✓</div><h2>طلبك وصل</h2><p>رقم الطلب <b dir="ltr">#${esc(OP.done)}</b></p><p class="sub">هنراجع الطلب ونأكدلك الإجمالي والشحن قريب.</p><button class="btn pri big" data-op="again">طلب جديد</button></div>`;return}
  const brands=[...new Set(c.products.map(p=>p.brand))];
  const list=c.products.filter(p=>(!OP.brand||(OP.brand==='__mine'?p.mine:p.brand===OP.brand))&&(!OP.q||norm(p.name+' '+p.brand).includes(norm(OP.q))));
  const bal=c.balance!=null?+c.balance:null;
  $('#orderApp').innerHTML=`<div class="ophead"><h1>${esc(c.page.name)}</h1><p>${c.customer?`أهلاً ${esc(c.customer.name)} · `:''}اختار الأصناف والكميات وابعت طلبك</p>
   ${bal!=null&&Math.abs(bal)>=1?`<div class="opbal ${bal>0?'due':'cr'}">${bal>0?`عليك <b>${fmt(bal)} ج</b>`:`ليك رصيد <b>${fmt(-bal)} ج</b>`}</div>`:''}</div>
  ${OP.step==='shop'?`<div class="opbody"><input type="search" id="opQ" placeholder="🔍 دوّر على عطر…" value="${esc(OP.q)}">
   ${(c.last||[]).length&&!items.length?`<button class="btn big" data-op="reorder" style="width:100%">🔁 اطلب زي آخر مرة (${c.last.length} صنف)</button>`:''}
   <div class="opbrands">${c.products.some(p=>p.mine)?`<button class="${OP.brand==='__mine'?'on':''}" data-op="brand" data-v="__mine">⭐ أصنافي</button>`:''}<button class="${!OP.brand?'on':''}" data-op="brand" data-v="">الكل</button>${brands.map(b=>`<button class="${OP.brand===b?'on':''}" data-op="brand" data-v="${esc(b)}">${esc(b)}</button>`).join('')}</div>
   <div class="oplist">${list.map(p=>{const qn=OP.cart[p.id]||0;return `<div class="opit ${qn?'in':''}"><div><b>${esc(p.name)}</b><small>${esc(p.brand)}${p.mine?' · <span class="opmine">سعرك الخاص</span>':''}</small></div><div class="opp">${fmt(p.price)} ج</div><div class="opq">${qn?`<button data-op="dec" data-v="${p.id}" aria-label="قلل">−</button><input type="number" min="0" value="${qn}" data-opq="${p.id}" aria-label="الكمية"><button data-op="inc" data-v="${p.id}" aria-label="زوّد">+</button>`:`<button class="add" data-op="inc" data-v="${p.id}">إضافة</button>`}</div></div>`}).join('')||'<div class="empty">مفيش نتايج</div>'}</div></div>`
  :`<div class="opbody"><div class="panel"><h3>طلبك</h3>${items.map(x=>`<div class="opsum"><span>${esc(x.p.name)}</span><span>${x.q} × ${fmt(x.p.price)}</span><b>${fmt(x.q*x.p.price)}</b></div>`).join('')}</div>
   <div class="panel" style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">بياناتك</h3>
    ${c.customer?`<p class="sub" style="margin:0">${esc(c.customer.name)} · ${esc(c.customer.phone||'')}</p>`:''}
    ${c.customer?'':`<div class="field"><label for="opN">الاسم</label><input type="text" id="opN" value="${esc(OP.cust.name)}"></div>`}
    <div class="field"><label for="opP">رقم الموبايل</label><input type="tel" id="opP" dir="ltr" value="${esc(OP.cust.phone||c.customer?.phone||'')}"></div>
    <div class="field"><label for="opA">العنوان</label><input type="text" id="opA" value="${esc(OP.cust.addr||c.customer?.addr||'')}"></div>
    <div class="field"><label for="opEx">أصناف مش لاقيها في القايمة (اختياري)</label><textarea id="opEx" rows="3" placeholder="اكتب اسم الصنف والعدد، مثال: عطر كذا × 6">${esc(OP.extra)}</textarea></div>
    <div class="field"><label for="opNo">ملاحظات (اختياري)</label><input type="text" id="opNo" value="${esc(OP.note)}"></div></div></div>`}
  <div class="opbar"><div><small>${pcs} قطعة</small><b>${fmt(tot)} ج</b></div>${OP.step==='shop'?`<button class="btn pri big" data-op="next">${pcs?'كمّل الطلب':'كمّل (أو اكتب صنف مش موجود)'}</button>`:`<button class="btn" data-op="back">رجوع</button><button class="btn pri big" data-op="send">ابعت الطلب</button>`}</div>`;
}
async function opSend(){
  const c=OP.cat;OP.cust={name:$('#opN')?.value.trim()||'',phone:$('#opP').value.trim(),addr:$('#opA').value.trim()};OP.note=$('#opNo').value.trim();OP.extra=($('#opEx')?.value||'').trim();
  if(!c.customer&&!OP.cust.name){toast('اكتب اسمك');return}
  if(!c.customer&&OP.cust.phone.replace(/\D/g,'').length<10){toast('اكتب رقم موبايل صحيح');return}
  const lines=Object.entries(OP.cart).filter(([,q])=>q>0).map(([id,q])=>({product_id:id,qty:q}));
  if(!lines.length&&!OP.extra){toast('اختار صنف واحد على الأقل أو اكتب الصنف اللي مش لاقيه');return}
  const note=[OP.extra?'📝 أصناف مش في القايمة: '+OP.extra:'',OP.note].filter(Boolean).join(' · ');
  try{spin(true);const code=await q(sb.rpc('submit_order',{p_token:OP.token,p_cust:OP.cust,p_lines:lines,p_note:note,p_pin:OP.pin||null}));if(String(code||'').startsWith('ERR:'))throw new Error(String(code).slice(4));OP.done=code;OP.cart={};opSave();drawOP()}
  catch(e){if(/pin_required/.test(e.message)){try{localStorage.removeItem('pin-'+OP.token)}catch(_){}toast('الرقم السري اتغير. افتح اللينك تاني');return}toast(/too_many/.test(e.message)?'اتبعت طلبات كتير. جرّب بعد شوية':errMsg(e))}finally{spin(false)}
}
document.addEventListener('click',e=>{
  if(!OP)return;const b=e.target.closest('[data-op]');if(!b)return;const a=b.dataset.op,v=b.dataset.v;
  if(a==='brand'){OP.brand=v;return drawOP()}
  if(a==='inc'){OP.cart[v]=(OP.cart[v]||0)+1;opSave();return drawOP()}
  if(a==='dec'){OP.cart[v]=Math.max(0,(OP.cart[v]||0)-1);if(!OP.cart[v])delete OP.cart[v];opSave();return drawOP()}
  if(a==='reorder'){(OP.cat.last||[]).forEach(x=>{if(OP.cat.products.find(p=>p.id===x.id))OP.cart[x.id]=(OP.cart[x.id]||0)+(+x.qty)});opSave();toast('اتحط آخر طلب في السلة، عدّل الكميات براحتك');return drawOP()}
  if(a==='next'){OP.step='form';window.scrollTo(0,0);return drawOP()}
  if(a==='back'){OP.step='shop';return drawOP()}
  if(a==='send')return opSend();
  if(a==='again'){OP.done=null;OP.step='shop';return drawOP()}
});
document.addEventListener('input',e=>{if(!OP)return;if(e.target.id==='opQ'){OP.q=e.target.value;const pos=e.target.selectionStart;drawOP();const n=$('#opQ');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener('change',e=>{if(!OP)return;const t=e.target;if(t.dataset.opq){const n=Math.max(0,Math.floor(+t.value||0));if(n)OP.cart[t.dataset.opq]=n;else delete OP.cart[t.dataset.opq];opSave();drawOP()}});

const fmtG=n=>{n=+n;return Number.isFinite(n)?String(Math.round(n*100)/100):'—'};
const canG=()=>role==='owner';
const rcp=pid=>(S.recipes||{})[pid]||null;
const hasOil=pid=>!!(pid&&rcp(pid)&&rcp(pid).oil);
function lineG(l){
  if(!l.pid)return null;
  if(l.g!=null&&l.g!=='')return +l.g;
  if(l.g0!=null)return +l.g0;
  const c=D.cust.id?(S.conc||{})[D.cust.id+':'+l.pid]:undefined;
  if(c!=null)return c;
  return rcp(l.pid)?.grams??null;
}
function unitCostOf(pid,g){
  const r=rcp(pid);
  if(r&&r.oil){const oc=(S.mcost||{})[r.oil];if(oc==null||g==null)return null;const ec=r.empty?(S.mcost||{})[r.empty]:(prod(pid)||{}).cost;if(ec==null)return null;const ax=alcX(pid,g);return g*oc+ec+(ax!=null?ax:(r.extra||0))}
  if(!r)return null; // صنف لسه ملوش زيت متسجل
  const p=prod(pid);return p?p.cost:null;
}
const matName=id=>((S.materials||[]).find(m=>m.id===id)||{}).name||'زيت';
const kgS=g=>{g=+g||0;return Math.abs(g)>=1000?fmtG(g/1000)+' كجم':fmtG(g)+' جم'};
const oilOf=pid=>{const r=rcp(pid);return r&&r.oil?(S.materials||[]).find(m=>m.id===r.oil)||null:null};
const pendOil=()=>{const o={};(S.queue||[]).filter(x=>!x.done).forEach(i=>i.lines.forEach(l=>{if(!l.ck&&l.g!=null&&l.oid)o[l.oid]=(o[l.oid]||0)+l.qty*l.g}));return o};
const avgG=pid=>{let q=0,g=0;S.invoices.forEach(i=>i.lines.forEach(l=>{if(l.pid===pid&&l.grams!=null){q+=l.qty;g+=l.qty*(l.ga??l.grams)}}));return q?g/q:null};
const gOf=pid=>{const r=rcp(pid);return r&&r.grams?r.grams:avgG(pid)};
function capOf(p,po){const m=oilOf(p.id),g=gOf(p.id);if(!m||!g)return null;return Math.max(0,Math.min(Math.max(0,p.stock),Math.floor((m.stock-(po[m.id]||0))/g)))}

  const w=norm(p.name).split(/\s+/).filter(x=>x.length>2);if(!w.length)return null;
  let best=null,bs=0;S.products.forEach(z=>{if(z.id===p.id)return;const r=rcp(z.id);if(!r||!r.oil||(S.mcost||{})[r.oil]==null)return;const zw=norm(z.name).split(/\s+/);const sc=w.filter(x=>zw.includes(x)).length;if(sc>bs){bs=sc;best=z}});
  return bs?best:null}

let csPer=null,csM='',csMode=null;
function cashLedger(){
  const L=[],pn=id=>prod(id)?.name||'صنف';
  S.payments.filter(p=>!p.void).forEach(p=>{const c=cust(p.custId);const inv=p.invId&&S.invoices.find(i=>i.id===p.invId);
    L.push({date:p.date,kind:'pay',m:p.method||'cash',amt:p.amount,desc:`دفعة${inv?' فاتورة '+inv.no:''}${c?' · '+c.name:''}${p.note?' · '+p.note:''}`})});
  S.expenses.filter(e=>!e.void&&!e.virtual).forEach(e=>L.push({date:e.date,kind:'exp',m:e.method||'cash',amt:-e.amount,desc:e.category+(e.note?' · '+e.note:'')}));
  (S.assets||[]).filter(a=>!a.void).forEach(a=>L.push({date:a.date,kind:'buy',m:a.method||'cash',amt:-a.cost,desc:'شراء أصل: '+a.name}));
  (S.supMoves||[]).filter(x=>x.kind==='pay'&&!x.auto&&!x.void).forEach(x=>L.push({date:x.date,kind:'buy',m:x.method||'cash',amt:-r2(x.amount),desc:`دفعة لمورد ${((S.suppliers||[]).find(z=>z.id===x.supplier_id)||{}).name||''}${x.note?' · '+x.note:''}`}));
  (S.oilBuys||[]).filter(x=>x.method!=='credit').forEach(x=>L.push({date:x.date,kind:'buy',m:x.method||'cash',amt:-r2(+x.total_cost),desc:`شراء ${kgS(+x.qty)} ${matName(x.material_id)}`}));
  (S.purAll||[]).filter(x=>x.cost!=null&&x.method!=='credit').forEach(x=>L.push({date:x.date,kind:'buy',m:x.method||'cash',amt:-r2(x.qty*x.cost),desc:`شراء ${fmt(x.qty)} × ${pn(x.pid)}`}));
  (S.moves||[]).filter(x=>!x.void).forEach(x=>{
    if(x.kind==='transfer'){L.push({date:x.date,kind:'tr',m:x.method,amt:-x.amount,desc:`تحويل لـ ${METHODS[x.to]||x.to}${x.note?' · '+x.note:''}`,mid:x.id});L.push({date:x.date,kind:'tr',m:x.to,amt:x.amount,desc:`تحويل من ${METHODS[x.method]||x.method}${x.note?' · '+x.note:''}`,mid:x.id})}
    else L.push({date:x.date,kind:x.kind,m:x.method,amt:x.kind==='in'?x.amount:-x.amount,desc:x.note||(x.kind==='in'?'إيداع':'سحب'),mid:x.id,at:x.at})});
  return L.sort((a,b)=>b.date.localeCompare(a.date)||(b.at||'').localeCompare(a.at||''));
}

function homeExtras(){
  if(role==='stock')return '';
  const MP=myPage(),showP=can('profit');const now=new Date();const ms=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(ld(d).slice(0,7))}
  const data=ms.map(m=>{const inv=S.invoices.filter(i=>i.date.slice(0,7)===m&&(!MP||i.page===MP));let p=0;inv.forEach(i=>p+=invProfit(i).p);
    const rs=(S.returns||[]).filter(r=>r.date.slice(0,7)===m&&(!MP||r.page===MP)&&!inv.some(i=>i.id===r.invId));let rv=0;rs.forEach(r=>r.lines.forEach(l=>{rv+=l.qty*l.price;if(l.cost!=null)p-=l.qty*(l.price-l.cost)}));
    return {m,s:inv.reduce((a,i)=>a+invSales(i),0)-rv,p}});
  const W=560,H=200,pl=8,pr=8,pt=16,pb=28;const mx=Math.max(1,...data.map(d=>Math.max(d.s,d.p)));

  const area=k=>path(k)+` L${X(5)},${H-pb} L${X(0)},${H-pb} Z`;

   ${data.map((d,i)=>`<circle cx="${X(i)}" cy="${Y(d.s)}" r="3.5" fill="#C9A45C"><title>${monthName(d.m)}: مبيعات ${fmt(d.s)}${showP?' · ربح '+fmt(d.p):''}</title></circle><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MONTHS[+d.m.slice(5)-1]}</text>`).join('')}
  </svg>`;
  const cur=data[5],prev=data[4];const ch=(a,b)=>b?`<span class="chip ${a>=b?'ok':'bad'}">${a>=b?'▲':'▼'} ${Math.abs(Math.round((a-b)/Math.abs(b)*100))}%</span>`:'';
  // top products in the selected home period
  const agg={};S.invoices.filter(i=>inPeriod(i.date)&&(!MP||i.page===MP)).forEach(i=>i.lines.forEach(l=>{const a=agg[l.pid]??={name:l.name,q:0,s:0,p:0,known:true};a.q+=l.qty;a.s+=l.qty*l.price;if(l.cost==null)a.known=false;else a.p+=l.qty*(l.price-l.cost)}));
  (S.returns||[]).filter(r=>inPeriod(r.date)&&(!MP||r.page===MP)).forEach(r=>r.lines.forEach(l=>{const a=agg[l.pid];if(!a)return;a.q-=l.qty;a.s-=l.qty*l.price;if(l.cost!=null)a.p-=l.qty*(l.price-l.cost)}));
  const key=showP?'p':'q';const top=Object.values(agg).filter(a=>a.q>0).sort((a,b)=>b[key]-a[key]).slice(0,5);const tm=Math.max(1,...top.map(a=>a[key]));
  return `<div class="grid g2">
   <div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${showP?'المبيعات والأرباح':'المبيعات'} · آخر 6 شهور</h3>

   </div></div>`;
}

const VAPID_PUB='BMv8-tnHHNONaiP3lsUP_ntjitpx8sr9BwXyXRQGoimzm_ULgbFX8YQ3-LK8-iBtBgWyfZ-P1bxngU2re45or98';
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function pushOK(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
async function pushSub(){try{const r=await navigator.serviceWorker.ready;return await r.pushManager.getSubscription()}catch(e){return null}}
async function pushRefreshBtn(){
  const b=$('#pushBtn');if(!b)return;
  if(!/^https?:$/.test(location.protocol)||!ME){b.hidden=true;return}
  b.hidden=false;
  if(!pushOK()){b.innerHTML='🔔 <span class="bl">إشعارات</span>';return}
  const sub=Notification.permission==='granted'?await pushSub():null;
  b.innerHTML=sub?'🔔 <span class="bl">الإشعارات شغالة</span>':'🔕 <span class="bl">فعّل الإشعارات</span>';b.classList.toggle('ghost',!sub);
}
async function pushToggle(){
  if(!pushOK()){const ios=/iphone|ipad/i.test(navigator.userAgent);toast(ios&&!isStandalone()?'على الآيفون: افتح من Safari > مشاركة > إضافة إلى الشاشة الرئيسية، وافتح التطبيق من الأيقونة وبعدين فعّل الإشعارات':'المتصفح ده مش بيدعم الإشعارات');return}
  if(/iphone|ipad/i.test(navigator.userAgent)&&!isStandalone()){toast('على الآيفون لازم تضيف التطبيق للشاشة الرئيسية الأول وتفتحه من الأيقونة');return}
  try{
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(sub&&Notification.permission==='granted'){
      await q(sb.rpc('unregister_push',{p_endpoint:sub.endpoint}));await sub.unsubscribe();toast('الإشعارات اتقفلت على الجهاز ده');return pushRefreshBtn()}
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('الإشعارات مرفوضة. فعّلها من إعدادات المتصفح/التطبيق');return pushRefreshBtn()}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
    const j=sub.toJSON();
    await q(sb.rpc('register_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent.slice(0,200)}));
    toast('الإشعارات اشتغلت ✅');pushRefreshBtn();
  }catch(e){toast('معرفناش نفعّل الإشعارات: '+errMsg(e))}
}

async function startApp(){
  const ot=new URLSearchParams(location.search).get('o');if(ot){return startOrderPage(ot)}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#boot').hidden=true;$('#login').hidden=false;$('#app').hidden=true;return}
  try{
    const p=await q(sb.from('profiles').select('id,name,role,page_id,active,maker').eq('id',session.user.id).maybeSingle());
    if(!p||!p.active){await sb.auth.signOut();$('#boot').hidden=true;$('#login').hidden=false;$('#lgMsg').textContent='الحساب ده مش متفعّل. كلّم المالك.';return}
    if(p.role==='stock'&&p.maker)p.role='maker';
    ME=p;role=p.role==='page'?'page:'+p.page_id:p.role;
    await loadAll();
  }catch(e){$('#boot').textContent=errMsg(e)+' — اعمل ريفريش';return}
  $('#boot').hidden=true;$('#login').hidden=true;$('#app').hidden=false;
  try{const t=localStorage.getItem(KEY+'-tab');if(t)tab=t}catch(e){}

}
function normUser(v){v=String(v||'').trim().toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const d=v.replace(/[\s\-()]/g,'');if(/^\+?\d{8,15}$/.test(d)){let n=d.replace(/^\+/,'');if(n.startsWith('0020'))n=n.slice(4);else if(n.startsWith('20')&&n.length===12)n=n.slice(2);if(n.length===10&&n[0]==='1')n='0'+n;return n}return v}
let wlcLogin=false;const wlcDay=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

      if(cloud)b.className='c';b.style.cssText=`width:${sz}px;height:${sz}px;margin:${-sz/2}px 0 0 ${-sz/2}px;background:${C[(k+Math.round(dl*10))%6]};animation-delay:${(dl+Math.random()*.2).toFixed(2)}s`;
      b.style.setProperty('--x',Math.round(Math.cos(a)*r)+'px');b.style.setProperty('--y',Math.round(Math.sin(a)*r)+'px');b.style.setProperty('--o',cloud?'.45':'.95');b.style.setProperty('--s',cloud?'2.6':'1.6');mist.appendChild(b)}});
    for(let k=0;k<14;k++){const b=document.createElement('b');b.style.background=C[k%6];b.style.setProperty('--x',Math.round(-170+Math.random()*340)+'px');b.style.setProperty('--y',Math.round(120+Math.random()*220)+'px');b.style.setProperty('--r',Math.round(-200+Math.random()*400)+'deg');b.style.animationDelay=(Math.random()*.5).toFixed(2)+'s';pt.appendChild(b)}}
  const at=(f,t)=>T.push(setTimeout(f,t));
  const finish=()=>{if(done)return;done=true;T.forEach(clearTimeout);w.classList.add('out');setTimeout(()=>{w.hidden=true;w.className='';$('#wlGr').classList.remove('on');mist.classList.remove('go');pt.classList.remove('go');['#wlL1','#wlL2','#wlL3','#wlL4'].forEach(i=>$(i).style.transform='translateY(160px)');res()},600)};

  at(()=>{['#wlL1','#wlL2','#wlL3','#wlL4'].forEach((i,k)=>$(i).style.transform=`translateY(${-22-k*22}px)`)},500);

  at(()=>{mist.classList.add('go');pt.classList.add('go')},2210);

#agLog .dr .ok{background:var(--accent,#C9A45C);color:#1b1204}#agLog .dr .no{background:transparent;color:var(--muted,#A49C8D);border:1px solid var(--line,#2D2A25)!important}
#agLog .dr .st{margin-top:6px;font-weight:600}
#agUse table{width:100%;border-collapse:collapse;font-size:13px}#agUse td,#agUse th{padding:4px 6px;border-bottom:1px solid var(--line,#2D2A25);text-align:right}
#agUse input{width:80px;padding:6px;border-radius:8px;border:1px solid var(--line,#2D2A25);background:var(--surface,#1B1A17);color:inherit}
</style>
<button id="agFab" type="button" aria-label="اسأل المساعد" hidden>💬 <span>اسأل</span></button>
<div id="agBox" hidden role="dialog" aria-label="المساعد">
  <div class="agh"><b>🤖 مساعد الفارس</b><small id="agCnt"></small><button type="button" id="agUseBtn" hidden>📊</button><button type="button" id="agNew" title="محادثة جديدة">↺</button><button type="button" id="agX" aria-label="قفل">✕</button></div>
  <div id="agLog"></div>
  <div id="agChips"></div>
  <form id="agForm"><textarea id="agIn" placeholder="اسأل… مثلاً: سوفاج فاضل منه كام؟" maxlength="1000"></textarea><button type="submit">إرسال</button></form>
</div>
<script>
(function(){
  const AG={hist:[],busy:false};
  const el=id=>document.getElementById(id);
  const fab=el('agFab'),box=el('agBox'),log=el('agLog'),inp=el('agIn');
  const CHIPS={
    maker:['خطة شغلي النهارده، أبدأ بإيه؟','إنتاجي النهارده','إنتاجي الأسبوع ده','آخر أصناف عملتها'],
    stock:['خطة شغلي النهارده، أبدأ بإيه؟','أطلب إيه النهارده؟','إنتاجي الأسبوع ده','الأوردرات المفتوحة','سوفاج فاضل منه كام؟'],
    page:['أوردراتي المفتوحة','سعر سوفاج لو العميل هياخد 300 قطعة','سعر سوفاج لعميل…','العميل … بياخد إيه عادة؟','الفاتورة … وصلت لفين؟'],
    billing:['الأوردرات المفتوحة','سعر صنف لعميل…','الفاتورة … وصلت لفين؟'],
    owner:['أطلب إيه النهارده؟','سعر سوفاج لو العميل هياخد 300 قطعة','قايمة الشراء','إنتاج الفريق الأسبوع ده','خطة الشغل النهارده','افتكر إن …','ناقص إيه في EB-247؟','سعر ليبر انتس لفدوي']
  };
  const fmtA=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https:\/\/wa\.me\/[^\s<]+)/g,u=>`<a href="${u.replace(/&amp;/g,'&')}" target="_blank" rel="noopener" class="wa">📲 ابعت على واتساب</a>`);
  function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
  function cnt(r){if(!r)return;el('agCnt').textContent=r.owner?'':(r.limit!=null?`${r.used_today}/${r.limit} النهارده`:'')}
  function chips(){const c=el('agChips');const L=CHIPS[ME&&ME.role]||CHIPS.stock;c.innerHTML=L.map(x=>`<button type="button">${esc(x)}</button>`).join('');
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=b.textContent;if(t.includes('…')){inp.value=t.replace('…','').trim()+' ';inp.focus()}else ask(t)})}
  const cutKey=()=>'ag-cut-'+(ME&&ME.id||'');
  // Restore the last conversation from the usage log (own rows only, RLS). Fails silently: the chat still works without it.
  async function loadHist(){if(AG.histLoaded||!ME)return;AG.histLoaded=true;
    try{let cut=new Date(Date.now()-3*864e5).toISOString();try{const c=localStorage.getItem(cutKey());if(c&&c>cut)cut=c}catch(e){}
      const {data,error}=await sb.from('agent_usage').select('id,q,a,created_at').eq('user_id',ME.id).eq('ok',true).gt('created_at',cut).order('created_at',{ascending:false}).limit(10);
      if(error||!data||!data.length||AG.hist.length)return;const L=data.slice().reverse(),first=log.firstChild,frag=document.createDocumentFragment();
      const mk=(cls,html)=>{const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;frag.appendChild(d)};
      L.forEach(x=>{mk('u old',esc(x.q||''));mk('a old',fmtA(x.a||''))});
      const sep=document.createElement('div');sep.className='agsep';sep.textContent='⬆ محادثتك السابقة · '+new Date(L[L.length-1].created_at).toLocaleString('ar-EG-u-nu-latn',{day:'numeric',month:'numeric',hour:'numeric',minute:'2-digit'});frag.appendChild(sep);
      log.insertBefore(frag,first);
      L.slice(-3).forEach(x=>AG.hist.push({role:'user',content:String(x.q||'')},{role:'assistant',content:String(x.a||'').slice(0,1500)}));
      log.scrollTop=log.scrollHeight}catch(e){}}
  function reset(){AG.hist=[];log.innerHTML='';add('a',`أهلاً ${esc(ME&&ME.name||'')} 👋\nاسألني عن المخزون، الزيوت، الفواتير، تركيز وسعر صنف لعميل، أو إنتاجك.`);chips()}
  async function ask(q){
    q=(q||'').trim();if(!q||AG.busy)return;AG.busy=true;inp.value='';
    add('u',esc(q));const w=add('a wait','بفكّر…');
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session)throw new Error('سجّل دخول تاني');
      const r=await fetch(SB_URL+'/functions/v1/agent',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({q,history:AG.hist.slice(-6)})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.answer)throw new Error(j.error==='auth'?'سجّل دخول تاني':'المساعد مش متاح دلوقتي');
      w.classList.remove('wait');w.innerHTML=fmtA(j.answer);cnt(j);if(j.id)rateRow(w,j.id);(j.drafts||[]).forEach(drawDraft);
      AG.hist.push({role:'user',content:q},{role:'assistant',content:j.answer});AG.hist=AG.hist.slice(-8);
    }catch(e){w.classList.remove('wait');w.textContent='⚠️ '+(e.message||'حصلت مشكلة')}
    AG.busy=false;log.scrollTop=log.scrollHeight;
  }
  function rateRow(w,id){const r=document.createElement('div');r.className='rt';r.innerHTML='<button type="button" data-v="1" title="رد كويس">👍</button><button type="button" data-v="-1" title="رد مش مظبوط">👎</button>';
    w.appendChild(r);r.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const v=+b.dataset.v;r.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
      try{await sb.rpc('ag_rate',{p_id:id,p_val:v});if(v<0)toast('شكرًا، فارس هيراجع الرد ده')}catch(e){}})}
  const nf=n=>(+n||0).toLocaleString('en-US');
  function drawDraft(d){
    const el=document.createElement('div');el.className='dr';
    el.innerHTML=`<h4>🧾 مسودة فاتورة — ${esc(d.customer)}${d.page?' · '+esc(d.page):''}</h4>
      ${d.isNew?`<div style="background:#fff7d6;color:#6b4e00;border-radius:8px;padding:6px 9px;margin:0 0 6px;font-size:.86em">🆕 عميل جديد${d.phone?' · '+esc(d.phone):' · من غير رقم'} — هيتسجل مع الفاتورة</div>`:''}
      <table><tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr>${(d.lines||[]).map(l=>`<tr><td>${esc(l.name)}${l.F?` <small>F${esc(l.F)}${l.g?` · ${esc(l.g)} جم`:''}</small>`:''}</td><td>${nf(l.qty)}</td><td>${nf(l.price)}<small>${esc(l.src||'')}</small></td><td>${nf(l.qty*l.price)}</td></tr>`).join('')}</table>
      <div class="tot"><span>الإجمالي</span><span>${nf(d.total)}</span></div>
      <div class="act"><button type="button" class="ok">✅ سجّل الفاتورة</button><button type="button" class="no">إلغاء</button></div><div class="st"></div>`;
    log.appendChild(el);log.scrollTop=log.scrollHeight;
    const ok=el.querySelector('.ok'),no=el.querySelector('.no'),st=el.querySelector('.st'),act=el.querySelector('.act');
    no.onclick=()=>{act.remove();st.textContent='اتلغت. محدش سجّل حاجة.'};
    ok.onclick=async()=>{ok.disabled=no.disabled=true;ok.textContent='بسجّل…';
      const {data,error}=await sb.rpc('ag_commit_draft',{p_id:d.id});
      if(error){ok.disabled=no.disabled=false;ok.textContent='✅ سجّل الفاتورة';st.textContent='⚠️ '+(error.message==='draft_expired'?'المسودة قديمة، اطلبها تاني':error.message);return}
      act.remove();st.innerHTML=`✅ اتسجلت الفاتورة <b>${esc(data.no||'')}</b>${data.already?' (كانت متسجلة قبل كده)':''}.${d.isNew&&!data.already?' والعميل الجديد اتضاف.':''} الدفع سجّله من الفاتورة لو اتدفع حاجة.`;
      AG.hist.push({role:'assistant',content:`تم: اتسجلت الفاتورة ${data.no} لـ ${d.customer}.`});
      try{if(typeof loadAll==='function'){await loadAll();if(typeof render==='function')render()}}catch(e){}
    };
  }
  async function usage(){
    const w=add('a wait','بجيب الاستهلاك…');
    const {data:u,error}=await sb.rpc('ag_usage_summary');
    if(error){w.textContent='⚠️ '+error.message;return}
    w.classList.remove('wait');w.id='';
    w.innerHTML=`<div id="agUse"><b>📊 استهلاك الشهر</b><br>${fmt(u.month_cost)}$ من ${fmt(u.cap)}$ — ${u.month_msgs} رسالة<br>
     <table><tr><th>المستخدم</th><th>النهارده</th><th>الشهر</th><th>$</th></tr>${(u.users||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.today}</td><td>${x.month}</td><td>${fmt(x.cost)}</td></tr>`).join('')||'<tr><td colspan=4>لسه مفيش</td></tr>'}</table>
     <div style="margin-top:8px">حد يومي لكل موظف <input id="agD" type="number" min="1" max="500" value="${u.daily_limit}"> سقف شهري $ <input id="agC" type="number" min="0" max="200" step="0.5" value="${u.cap}"> <button type="button" id="agSave" class="btn sm">حفظ</button></div>
     <details style="margin-top:6px" ${(u.bad||[]).length?'open':''}><summary>👎 ردود محتاجة مراجعة (${(u.bad||[]).length})</summary>${(u.bad||[]).map(x=>`<div style="margin:4px 0">${esc(x.at)} — <b>${esc(x.name)}</b>: ${esc(x.q)}<br><small>${esc(x.a||'')}</small></div>`).join('')||'<div>مفيش 👌</div>'}</details>
     <details style="margin-top:6px"><summary>📌 قواعدك للمساعد (${(u.rules||[]).length}) · أسماء اتعلمها: ${u.learned||0}</summary>${(u.rules||[]).map(x=>`<div style="margin:4px 0">• ${esc(x.body)} <button type="button" class="btn sm" data-rdel="${x.id}">مسح</button></div>`).join('')||'<div>مفيش قواعد. اكتب للمساعد: «افتكر إن …»</div>'}</details>
     <details style="margin-top:6px"><summary>آخر الأسئلة</summary>${(u.recent||[]).map(x=>`<div>${esc(x.at)} — <b>${esc(x.name)}</b>: ${esc(x.q)}${x.ok?'':' ⚠️'}</div>`).join('')}</details></div>`;
    w.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{const {error}=await sb.rpc('ag_del_rule',{p_id:+b.dataset.rdel});if(!error)b.parentElement.remove();toast(error?error.message:'اتمسحت')});
    el('agSave').onclick=async()=>{const {error}=await sb.rpc('ag_set_config',{p_daily:+el('agD').value,p_cap:+el('agC').value});toast(error?error.message:'اتحفظ')};
    log.scrollTop=log.scrollHeight;
  }
  async function checkBrief(){try{const {data}=await sb.rpc('ag_my_brief',{p_seen:false});if(!data)return;AG.brief=data;if(!data.seen)fab.classList.add('dot');if(location.hash==='#brief'){openBox();history.replaceState(null,'',location.pathname)}}catch(e){}}
  function showBrief(){if(!AG.brief||AG.briefShown)return;AG.briefShown=true;const d=add('a brief',fmtA(AG.brief.body));fab.classList.remove('dot');sb.rpc('ag_my_brief',{p_seen:true}).then(()=>{},()=>{});AG.hist.push({role:'user',content:'رسالة الصبح'},{role:'assistant',content:AG.brief.body});return d}
  function openBox(){box.hidden=false;if(!log.children.length){reset();loadHist()}showBrief();setTimeout(()=>inp.focus(),50)}
  fab.onclick=openBox;
  try{navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='push-open'&&String(e.data.url||'').includes('#brief')){if(!AG.brief)checkBrief().then(openBox);else openBox()}})}catch(e){}
  el('agX').onclick=()=>{box.hidden=true};
  el('agNew').onclick=()=>{try{localStorage.setItem(cutKey(),new Date().toISOString())}catch(e){};AG.histLoaded=true;reset()};
  el('agUseBtn').onclick=usage;
  el('agForm').onsubmit=e=>{e.preventDefault();ask(inp.value)};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(inp.value)}});
  const t=setInterval(()=>{
    const app=document.getElementById('app');
    if(typeof ME!=='undefined'&&ME&&app&&!app.hidden){if(fab.hidden&&!AG.briefChecked){AG.briefChecked=true;checkBrief()}fab.hidden=false;el('agUseBtn').hidden=ME.role!=='owner'}
    else{fab.hidden=true;box.hidden=true;if(typeof ME==='undefined'||!ME){AG.hist=[];AG.histLoaded=false;log.innerHTML='';AG.brief=null;AG.briefShown=false;AG.briefChecked=false;fab.classList.remove('dot')}}
  },1000);
})();
</script>
</body></html>
